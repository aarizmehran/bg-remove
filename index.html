<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Editor Pro</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <h1>Photo Editor Pro</h1>
            </div>
            <div class="header-actions">
                <button class="btn-icon" id="themeToggle" title="Toggle Theme">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <button class="btn btn-primary" id="exportBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Export
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Sidebar - Tools -->
            <aside class="sidebar left-sidebar">
                <div class="upload-section" id="uploadSection">
                    <div class="upload-area" id="uploadArea">
                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <p>Drag & drop image here</p>
                        <span>or click to browse</span>
                        <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" hidden>
                    </div>
                </div>

                <nav class="tools-nav">
                    <button class="tool-btn active" data-tool="adjustments">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="4" y1="21" x2="4" y2="14"/>
                            <line x1="4" y1="10" x2="4" y2="3"/>
                            <line x1="12" y1="21" x2="12" y2="12"/>
                            <line x1="12" y1="8" x2="12" y2="3"/>
                            <line x1="20" y1="21" x2="20" y2="16"/>
                            <line x1="20" y1="12" x2="20" y2="3"/>
                        </svg>
                        Adjust
                    </button>
                    <button class="tool-btn" data-tool="transform">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="15 3 21 3 21 9"/>
                            <polyline points="9 21 3 21 3 15"/>
                            <line x1="21" y1="3" x2="14" y2="10"/>
                            <line x1="3" y1="21" x2="10" y2="14"/>
                        </svg>
                        Transform
                    </button>
                    <button class="tool-btn" data-tool="draw">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                            <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            <path d="M2 2l7.586 7.586"/>
                            <circle cx="11" cy="11" r="2"/>
                        </svg>
                        Draw
                    </button>
                    <button class="tool-btn" data-tool="text">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="4 7 4 4 20 4 20 7"/>
                            <line x1="9" y1="20" x2="15" y2="20"/>
                            <line x1="12" y1="4" x2="12" y2="20"/>
                        </svg>
                        Text
                    </button>
                    <button class="tool-btn" data-tool="filters">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>
                        </svg>
                        Filters
                    </button>
                </nav>
            </aside>

            <!-- Main Editor Area -->
            <section class="editor-area">
                <div class="canvas-container" id="canvasContainer">
                    <canvas id="mainCanvas"></canvas>
                    <div class="canvas-placeholder" id="canvasPlaceholder">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
                            <rect x="3" y="3" width="18" height="18" rx="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <path d="M21 15l-5-5L5 21"/>
                        </svg>
                        <p>Upload an image to start editing</p>
                    </div>
                </div>
                
                <!-- Zoom Controls -->
                <div class="zoom-controls" id="zoomControls" style="display: none;">
                    <button class="btn-icon" id="zoomOut">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                        </svg>
                    </button>
                    <span id="zoomLevel">100%</span>
                    <button class="btn-icon" id="zoomIn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                            <line x1="11" y1="8" x2="11" y2="14"/>
                            <line x1="8" y1="11" x2="14" y2="11"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="fitToScreen">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                    </button>
                </div>

                <!-- History Controls -->
                <div class="history-controls" id="historyControls" style="display: none;">
                    <button class="btn-icon" id="undoBtn" title="Undo (Ctrl+Z)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="redoBtn" title="Redo (Ctrl+Y)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                        </svg>
                    </button>
                    <button class="btn-icon" id="resetBtn" title="Reset All">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"/>
                            <polyline points="1 20 1 14 7 14"/>
                            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Right Panel - Options -->
            <aside class="right-panel" id="rightPanel">
                <!-- Adjustments Panel -->
                <div class="panel adjustments-panel active" data-panel="adjustments">
                    <h3>Adjustments</h3>
                    <div class="slider-group">
                        <label>Brightness</label>
                        <input type="range" id="brightness" min="0" max="200" value="100">
                        <span class="slider-value" id="brightnessValue">100</span>
                    </div>
                    <div class="slider-group">
                        <label>Contrast</label>
                        <input type="range" id="contrast" min="0" max="200" value="100">
                        <span class="slider-value" id="contrastValue">100</span>
                    </div>
                    <div class="slider-group">
                        <label>Saturation</label>
                        <input type="range" id="saturation" min="0" max="200" value="100">
                        <span class="slider-value" id="saturationValue">100</span>
                    </div>
                    <div class="slider-group">
                        <label>Exposure</label>
                        <input type="range" id="exposure" min="-100" max="100" value="0">
                        <span class="slider-value" id="exposureValue">0</span>
                    </div>
                    <div class="slider-group">
                        <label>Hue Rotate</label>
                        <input type="range" id="hueRotate" min="0" max="360" value="0">
                        <span class="slider-value" id="hueRotateValue">0°</span>
                    </div>
                    <div class="slider-group">
                        <label>Blur</label>
                        <input type="range" id="blur" min="0" max="20" value="0">
                        <span class="slider-value" id="blurValue">0</span>
                    </div>
                    <div class="slider-group">
                        <label>Sharpness</label>
                        <input type="range" id="sharpness" min="0" max="100" value="0">
                        <span class="slider-value" id="sharpnessValue">0</span>
                    </div>
                    <div class="slider-group">
                        <label>Opacity</label>
                        <input type="range" id="opacity" min="0" max="100" value="100">
                        <span class="slider-value" id="opacityValue">100</span>
                    </div>
                    <div class="slider-group">
                        <label>Grayscale</label>
                        <input type="range" id="grayscale" min="0" max="100" value="0">
                        <span class="slider-value" id="grayscaleValue">0</span>
                    </div>
                    <div class="slider-group">
                        <label>Sepia</label>
                        <input type="range" id="sepia" min="0" max="100" value="0">
                        <span class="slider-value" id="sepiaValue">0</span>
                    </div>
                    <div class="slider-group">
                        <label>Invert</label>
                        <input type="range" id="invert" min="0" max="100" value="0">
                        <span class="slider-value" id="invertValue">0</span>
                    </div>
                </div>

                <!-- Transform Panel -->
                <div class="panel transform-panel" data-panel="transform">
                    <h3>Transform</h3>
                    <div class="transform-buttons">
                        <button class="btn-transform" id="rotateLeft">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                            Rotate Left
                        </button>
                        <button class="btn-transform" id="rotateRight">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
                                <path d="M21 3v5h-5"/>
                            </svg>
                            Rotate Right
                        </button>
                        <button class="btn-transform" id="flipHorizontal">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                            </svg>
                            Flip H
                        </button>
                        <button class="btn-transform" id="flipVertical">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 8V5a2 2 0 0 1 2-2h3m0 18h3a2 2 0 0 0 2-2v-3M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3"/>
                            </svg>
                            Flip V
                        </button>
                    </div>
                    <div class="slider-group">
                        <label>Crop</label>
                        <div class="crop-presets">
                            <button class="btn-crop-preset" data-ratio="free">Free</button>
                            <button class="btn-crop-preset" data-ratio="1:1">1:1</button>
                            <button class="btn-crop-preset" data-ratio="4:3">4:3</button>
                            <button class="btn-crop-preset" data-ratio="16:9">16:9</button>
                        </div>
                        <button class="btn btn-secondary" id="applyCrop" style="width: 100%; margin-top: 10px;">Apply Crop</button>
                    </div>
                    <div class="slider-group">
                        <label>Resize</label>
                        <div class="resize-inputs">
                            <input type="number" id="resizeWidth" placeholder="Width">
                            <span>×</span>
                            <input type="number" id="resizeHeight" placeholder="Height">
                        </div>
                        <label class="checkbox-label">
                            <input type="checkbox" id="maintainAspectRatio" checked>
                            Maintain Aspect Ratio
                        </label>
                        <button class="btn btn-secondary" id="applyResize" style="width: 100%; margin-top: 10px;">Apply Resize</button>
                    </div>
                </div>

                <!-- Draw Panel -->
                <div class="panel draw-panel" data-panel="draw">
                    <h3>Drawing Tools</h3>
                    <div class="draw-tools">
                        <button class="btn-draw-tool active" id="brushTool">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                            </svg>
                            Brush
                        </button>
                        <button class="btn-draw-tool" id="eraserTool">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 20H7L3 16C2 15 2 13 3 12L13 2L22 11L20 20Z"/>
                                <path d="M17 17L7 7"/>
                            </svg>
                            Eraser
                        </button>
                    </div>
                    <div class="slider-group">
                        <label>Brush Size</label>
                        <input type="range" id="brushSize" min="1" max="50" value="5">
                        <span class="slider-value" id="brushSizeValue">5</span>
                    </div>
                    <div class="color-picker-group">
                        <label>Color</label>
                        <input type="color" id="brushColor" value="#000000">
                        <div class="color-presets">
                            <span class="color-preset" data-color="#000000"></span>
                            <span class="color-preset" data-color="#ffffff"></span>
                            <span class="color-preset" data-color="#ff0000"></span>
                            <span class="color-preset" data-color="#00ff00"></span>
                            <span class="color-preset" data-color="#0000ff"></span>
                            <span class="color-preset" data-color="#ffff00"></span>
                            <span class="color-preset" data-color="#ff00ff"></span>
                            <span class="color-preset" data-color="#00ffff"></span>
                        </div>
                    </div>
                </div>

                <!-- Text Panel -->
                <div class="panel text-panel" data-panel="text">
                    <h3>Text Tool</h3>
                    <div class="slider-group">
                        <label>Text Content</label>
                        <textarea id="textContent" rows="2" placeholder="Enter your text..."></textarea>
                    </div>
                    <div class="slider-group">
                        <label>Font Size</label>
                        <input type="range" id="fontSize" min="12" max="120" value="32">
                        <span class="slider-value" id="fontSizeValue">32px</span>
                    </div>
                    <div class="slider-group">
                        <label>Font Family</label>
                        <select id="fontFamily">
                            <option value="Arial">Arial</option>
                            <option value="Helvetica">Helvetica</option>
                            <option value="Times New Roman">Times New Roman</option>
                            <option value="Georgia">Georgia</option>
                            <option value="Verdana">Verdana</option>
                            <option value="Courier New">Courier New</option>
                            <option value="Impact">Impact</option>
                            <option value="Comic Sans MS">Comic Sans MS</option>
                        </select>
                    </div>
                    <div class="color-picker-group">
                        <label>Text Color</label>
                        <input type="color" id="textColor" value="#000000">
                    </div>
                    <button class="btn btn-primary" id="addText" style="width: 100%;">Add Text</button>
                    <p class="hint">Click and drag text to reposition. Press Delete to remove.</p>
                </div>

                <!-- Filters Panel -->
                <div class="panel filters-panel" data-panel="filters">
                    <h3>Filters</h3>
                    <div class="filters-grid">
                        <button class="filter-btn" data-filter="none">
                            <div class="filter-preview" style="background: linear-gradient(45deg, #667eea, #764ba2);"></div>
                            <span>None</span>
                        </button>
                        <button class="filter-btn" data-filter="vintage">
                            <div class="filter-preview vintage"></div>
                            <span>Vintage</span>
                        </button>
                        <button class="filter-btn" data-filter="cinematic">
                            <div class="filter-preview cinematic"></div>
                            <span>Cinematic</span>
                        </button>
                        <button class="filter-btn" data-filter="neon">
                            <div class="filter-preview neon"></div>
                            <span>Neon</span>
                        </button>
                        <button class="filter-btn" data-filter="bw">
                            <div class="filter-preview bw"></div>
                            <span>B&W</span>
                        </button>
                        <button class="filter-btn" data-filter="warm">
                            <div class="filter-preview warm"></div>
                            <span>Warm</span>
                        </button>
                        <button class="filter-btn" data-filter="cool">
                            <div class="filter-preview cool"></div>
                            <span>Cool</span>
                        </button>
                        <button class="filter-btn" data-filter="retro">
                            <div class="filter-preview retro"></div>
                            <span>Retro</span>
                        </button>
                        <button class="filter-btn" data-filter="hdr">
                            <div class="filter-preview hdr"></div>
                            <span>HDR</span>
                        </button>
                        <button class="filter-btn" data-filter="softglow">
                            <div class="filter-preview softglow"></div>
                            <span>Soft Glow</span>
                        </button>
                    </div>
                </div>
            </aside>
        </main>
    </div>

    <!-- Export Modal -->
    <div class="modal" id="exportModal">
        <div class="modal-content">
            <h2>Export Image</h2>
            <div class="export-options">
                <div class="slider-group">
                    <label>Format</label>
                    <select id="exportFormat">
                        <option value="image/png">PNG</option>
                        <option value="image/jpeg">JPEG</option>
                        <option value="image/webp">WEBP</option>
                    </select>
                </div>
                <div class="slider-group">
                    <label>Quality</label>
                    <input type="range" id="exportQuality" min="1" max="100" value="90">
                    <span class="slider-value" id="exportQualityValue">90%</span>
                </div>
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelExport">Cancel</button>
                <button class="btn btn-primary" id="confirmExport">Download</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
